version: "3.9"
services:
    VulnerableApp-base:
      image: sasanlabs/owasp-vulnerableapp:unreleased
      # Immutable container filesystem (CWE-732). Every path the application writes to at
      # runtime is backed by a tmpfs below:
      #   /tmp                           JVM temp files, embedded Tomcat work directory and the
      #                                  Files.createTempDirectory fallback of the file upload lesson
      #   /logs                          log4j2 rolling file appender (./logs/server.log)
      #   /benchmarks                    benchmark.output.dir written by /scanner/benchmark
      #   /contentDispositionUpload      upload directory created on startup by the file upload lesson
      #   /app/resources/static/upload   upload directory served back as /VulnerableApp/upload
      read_only: true
      tmpfs:
        - /tmp
        - /logs
        - /benchmarks
        - /contentDispositionUpload
        - /app/resources/static/upload
      # No privilege escalation through setuid/setgid binaries (CWE-732).
      security_opt:
        - no-new-privileges:true
      networks:
        - app_net

    mailpit:
      image: axllent/mailpit:v1.30.1
      restart: unless-stopped
      expose:
        - "1025"
      ports:
        - "8025:8025"
      environment:
        - MP_MAX_MESSAGES=5000
        - MP_DATABASE=/data/mailpit.db
        - MP_SMTP_AUTH_ACCEPT_ANY=1
        - MP_SMTP_AUTH_ALLOW_INSECURE=1
        - MP_WEBROOT=/mailpit
      # Immutable container filesystem (CWE-732): the message store stays in the mailpit_data
      # volume, /tmp covers the SQLite scratch files.
      read_only: true
      tmpfs:
        - /tmp
      volumes:
        - mailpit_data:/data
      # No privilege escalation through setuid/setgid binaries (CWE-732).
      security_opt:
        - no-new-privileges:true
      networks:
        app_net:
          aliases:
            - mailpit

    VulnerableApp-facade:
      depends_on:
        - VulnerableApp-base
        - mailpit
      image: sasanlabs/owasp-vulnerableapp-facade:latest
      # Immutable container filesystem (CWE-732). nginx still needs to write its pid file and
      # its proxy/client body buffers, and the entrypoint renders /etc/nginx/templates into
      # /etc/nginx/conf.d on every start. conf.d therefore uses a named volume rather than a
      # tmpfs: a volume is seeded with the configuration that ships in the image and stays
      # writable, so both the rendered and the built-in configuration survive. Refresh it after
      # pulling a newer facade image:
      #   docker compose down && docker volume rm <compose-project>_facade_nginx_conf
      read_only: true
      tmpfs:
       - /var/cache/nginx
       - /var/run
      volumes:
       - ./templates:/etc/nginx/templates
       - facade_nginx_conf:/etc/nginx/conf.d
      ports:
       - "80:80"
      environment:
       - NGINX_HOST=foobar.com
       - NGINX_PORT=80
      # No privilege escalation through setuid/setgid binaries (CWE-732). nginx starts as root to
      # bind port 80 and then drops its workers to the unprivileged nginx user, which needs no new
      # privileges, so the facade keeps working.
      security_opt:
       - no-new-privileges:true
      networks:
        - app_net

networks:
  app_net:
    name: vulnerableapp-facade_net
    driver: bridge

volumes:
  mailpit_data:
  # Writable copy of the facade's /etc/nginx/conf.d, needed because that container now runs
  # with a read-only root filesystem.
  facade_nginx_conf:
