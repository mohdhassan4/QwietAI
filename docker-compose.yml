version: "3.9"
services:
    VulnerableApp-base:
      image: sasanlabs/owasp-vulnerableapp:latest
      # Immutable container filesystem (CWE-732). Every path the application writes to at
      # runtime is backed by a tmpfs below:
      #   /tmp                           JVM temp files, embedded Tomcat work directory and the
      #                                  Files.createTempDirectory fallback of the file upload lesson
      #   /logs                          log4j2 rolling file appender (./logs/server.log)
      #   /benchmarks                    benchmark.output.dir written by /scanner/benchmark
      #   /contentDispositionUpload      upload directory created on startup by the file upload lesson
      #   /app/resources/static/upload   upload directory served back as /VulnerableApp/upload
      read_only: true
      tmpfs:
        - /tmp
        - /logs
        - /benchmarks
        - /contentDispositionUpload
        - /app/resources/static/upload
      # No privilege escalation through setuid/setgid binaries (CWE-732).
      security_opt:
        - no-new-privileges:true
      networks:
        - app_net

    VulnerableApp-jsp:
      image: sasanlabs/owasp-vulnerableapp-jsp:latest
      # read_only is deliberately not set: Tomcat expands the WAR shipped inside the image and
      # compiles the JSPs underneath /usr/local/tomcat, so the directory that holds the
      # application artifact itself has to stay writable.
      # No privilege escalation through setuid/setgid binaries (CWE-732).
      security_opt:
        - no-new-privileges:true
      networks:
        - app_net

    VulnerableApp-php:
      image: sasanlabs/owasp-vulnerableapp-php:latest
      # read_only is deliberately not set: the PHP lessons (file upload in particular) write
      # into the document root that ships inside the image, so the directory that holds the
      # application code itself has to stay writable.
      # No privilege escalation through setuid/setgid binaries (CWE-732).
      security_opt:
        - no-new-privileges:true
      networks:
        - app_net

    ollama:
      image: ollama/ollama:latest
      ports:
       - "11434:11434"
      # Immutable container filesystem (CWE-732): models, manifests and the node key live in
      # the ollama_data volume, /tmp is the only other path the server writes to.
      read_only: true
      tmpfs:
       - /tmp
      volumes:
       - ollama_data:/root/.ollama
      # No privilege escalation through setuid/setgid binaries (CWE-732).
      security_opt:
       - no-new-privileges:true
      healthcheck:
        test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 12
        start_period: 20s
      networks:
        app_net:
          aliases:
            - ollama

    ollama-model-init:
      image: ollama/ollama:latest
      depends_on:
        ollama:
          condition: service_healthy
      environment:
       - OLLAMA_HOST=http://ollama:11434
       - OLLAMA_MODEL=${OLLAMA_MODEL:-phi3:mini}
       - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      entrypoint: /bin/sh
      command:
       - "-c"
       - |
          set -eu
          ollama pull "${OLLAMA_MODEL:-phi3:mini}"
          ollama pull "${OLLAMA_EMBED_MODEL:-nomic-embed-text}"
      # Immutable container filesystem (CWE-732): the pulled models are written to the shared
      # ollama_data volume, /tmp covers the client's scratch files.
      read_only: true
      tmpfs:
       - /tmp
      volumes:
       - ollama_data:/root/.ollama
      # No privilege escalation through setuid/setgid binaries (CWE-732).
      security_opt:
       - no-new-privileges:true
      restart: "no"
      networks:
        - app_net

    llmforge:
      image: sasanlabs/llmforge:latest
      # read_only is deliberately not set: the writable paths of this image (model/tokenizer
      # caches and any local state the service keeps) are not documented anywhere in this
      # repository, and an incomplete guess would crash-loop the whole LLM stack.
      depends_on:
        ollama:
          condition: service_healthy
        ollama-model-init:
          condition: service_completed_successfully
      ports:
       - "8000:8000"
      environment:
       - OLLAMA_URL=http://ollama:11434
       - OLLAMA_MODEL=${OLLAMA_MODEL:-phi3:mini}
       - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
       - FACADE_ROUTE_PREFIX=/llmforge
      # No privilege escalation through setuid/setgid binaries (CWE-732).
      security_opt:
       - no-new-privileges:true
      networks:
        app_net:
          aliases:
            - llmforge

    mailpit:
      image: axllent/mailpit:v1.30.1
      restart: unless-stopped
      expose:
        - "1025"
      ports:
        - "8025:8025"
      environment:
        - MP_MAX_MESSAGES=5000
        - MP_DATABASE=/data/mailpit.db
        - MP_SMTP_AUTH_ACCEPT_ANY=1
        - MP_SMTP_AUTH_ALLOW_INSECURE=1
        - MP_WEBROOT=/mailpit
      # Immutable container filesystem (CWE-732): the message store stays in the mailpit_data
      # volume, /tmp covers the SQLite scratch files.
      read_only: true
      tmpfs:
        - /tmp
      volumes:
        - mailpit_data:/data
      # No privilege escalation through setuid/setgid binaries (CWE-732).
      security_opt:
        - no-new-privileges:true
      networks:
        app_net:
          aliases:
            - mailpit

    VulnerableApp-facade:
      depends_on:
        - VulnerableApp-base
        - VulnerableApp-jsp
        - VulnerableApp-php
        - llmforge
        - mailpit
      image: sasanlabs/owasp-vulnerableapp-facade:latest
      # Immutable container filesystem (CWE-732). nginx still needs to write its pid file and
      # its proxy/client body buffers, and the entrypoint renders /etc/nginx/templates into
      # /etc/nginx/conf.d on every start. conf.d therefore uses a named volume rather than a
      # tmpfs: a volume is seeded with the configuration that ships in the image and stays
      # writable, so both the rendered and the built-in configuration survive. Refresh it after
      # pulling a newer facade image:
      #   docker compose down && docker volume rm <compose-project>_facade_nginx_conf
      read_only: true
      tmpfs:
       - /var/cache/nginx
       - /var/run
      volumes:
       - ./templates:/etc/nginx/templates
       - facade_nginx_conf:/etc/nginx/conf.d
      ports:
       - "80:80"
      environment:
       - NGINX_HOST=foobar.com
       - NGINX_PORT=80
       - ENABLE_VULNERABLEAPP_JSP=true
       - ENABLE_VULNERABLEAPP_PHP=true
       - ENABLE_LLMFORGE=true
      # No privilege escalation through setuid/setgid binaries (CWE-732). nginx starts as root to
      # bind port 80 and then drops its workers to the unprivileged nginx user, which needs no new
      # privileges, so the facade keeps working.
      security_opt:
       - no-new-privileges:true
      networks:
        - app_net

networks:
  app_net:
    name: vulnerableapp-facade_net
    driver: bridge

volumes:
  ollama_data:
  mailpit_data:
  # Writable copy of the facade's /etc/nginx/conf.d, needed because that container now runs
  # with a read-only root filesystem.
  facade_nginx_conf:
