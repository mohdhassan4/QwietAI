spring.datasource.admin.username=admin
spring.datasource.admin.password=${DB_ADMIN_PASSWORD:}

spring.datasource.application.username=application
spring.datasource.application.password=${DB_APP_PASSWORD:}

# Credentials for additional H2 in-memory DB users (created via VulnerableAppConfiguration)
spring.datasource.readonly.password=${DB_READONLY_PASSWORD:}
spring.datasource.crypto.password=${DB_CRYPTO_PASSWORD:}

# Enabling H2 Console
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

vulnerableapp.email.base-url=http://localhost
