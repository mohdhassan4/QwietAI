spring.datasource.admin.username=admin
spring.datasource.admin.password=${DB_ADMIN_PASSWORD:}

spring.datasource.application.username=application
spring.datasource.application.password=${DB_APP_PASSWORD:}

# Enabling H2 Console
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

vulnerableapp.email.base-url=http://localhost

# Module-specific DB user passwords (externalized - provide via environment)
vulnerableapp.db.readonly-user.password=${DB_READONLY_PASSWORD:}
vulnerableapp.db.crypto-user.password=${DB_CRYPTO_USER_PASSWORD:}

# Cryptographic Failures challenge Level 10 secret (externalized - provide via environment)
vulnerableapp.crypto.level10.secret=${CRYPTO_LEVEL10_SECRET:}
