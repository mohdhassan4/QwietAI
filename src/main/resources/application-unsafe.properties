spring.datasource.admin.username=admin
# Credential must be rotated — it remains in git history
spring.datasource.admin.password=${SPRING_DATASOURCE_ADMIN_PASSWORD}

spring.datasource.application.username=application
spring.datasource.application.password=${SPRING_DATASOURCE_APP_PASSWORD}

# Enabling H2 Console (not credentials - configuration flags)
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

vulnerableapp.email.base-url=http://localhost
