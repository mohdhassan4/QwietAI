spring.datasource.admin.username=${DATASOURCE_ADMIN_USERNAME:admin}
spring.datasource.admin.password=${DATASOURCE_ADMIN_PASSWORD:}

spring.datasource.application.username=${DATASOURCE_APPLICATION_USERNAME:application}
spring.datasource.application.password=${DATASOURCE_APPLICATION_PASSWORD:}

# H2 Console disabled for security (CWE-16)
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

vulnerableapp.email.base-url=http://localhost
