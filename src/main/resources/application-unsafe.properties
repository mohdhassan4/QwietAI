spring.datasource.admin.username=admin
spring.datasource.admin.password=${DB_ADMIN_PASSWORD}

spring.datasource.application.username=application
spring.datasource.application.password=${DB_APP_PASSWORD}

# H2 in-memory DB users for vulnerability exercises
db.readonly.user.password=${DB_READONLY_PASSWORD}
db.crypto.user.password=${DB_CRYPTO_USER_PASSWORD}

# H2 Console disabled for security (CWE-16)
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

vulnerableapp.email.base-url=http://localhost
