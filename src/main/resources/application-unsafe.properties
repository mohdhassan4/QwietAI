spring.datasource.admin.username=admin
spring.datasource.admin.password=${DB_ADMIN_PASSWORD:hacker}

spring.datasource.application.username=application
spring.datasource.application.password=${DB_APP_PASSWORD:hacker}

# Passwords for additional H2 in-memory DB users (created via VulnerableAppConfiguration)
spring.datasource.readonly.password=${DB_READONLY_PASSWORD:readonly_password}
spring.datasource.crypto.password=${DB_CRYPTO_PASSWORD:cryptographic_failures_password}

# Enabling H2 Console
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

vulnerableapp.email.base-url=http://localhost
