spring.datasource.admin.username=admin
# Credential rotated — rotate this secret; it was previously exposed in version control
spring.datasource.admin.password=${DB_ADMIN_PASSWORD:changeme}

spring.datasource.application.username=application
# Credential rotated — rotate this secret; it was previously exposed in version control
spring.datasource.application.password=${DB_APP_PASSWORD:changeme}

# H2 Console disabled for security
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

vulnerableapp.email.base-url=http://localhost
