spring.datasource.admin.username=admin
spring.datasource.admin.password=${DB_ADMIN_PASSWORD:hacker}

spring.datasource.application.username=application
spring.datasource.application.password=${DB_APP_PASSWORD:hacker}

# H2 Console disabled for security (CWE-16)
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

vulnerableapp.email.base-url=http://localhost

jwt.keystore.password=${JWT_KEYSTORE_PASSWORD:changeIt}
crypto.level10.password=${CRYPTO_LEVEL10_PASSWORD:aa123456}
