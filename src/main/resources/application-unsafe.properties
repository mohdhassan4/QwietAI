spring.datasource.admin.username=admin
spring.datasource.admin.password=hacker

spring.datasource.application.username=application
spring.datasource.application.password=hacker

# Enabling H2 Console
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

vulnerableapp.email.base-url=http://localhost

# Secrets must be supplied via env vars: JWT_KEYSTORE_PASSWORD, CRYPTO_LEVEL10_SECRET
jwt.keystore.password=${JWT_KEYSTORE_PASSWORD:}
crypto.level10.secret=${CRYPTO_LEVEL10_SECRET:}
