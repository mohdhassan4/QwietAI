spring.datasource.admin.username=admin
# Admin password comes from the environment (DB_ADMIN_PASSWORD, the same variable the public
# profile and scripts/productionize use). When it is not set, a fresh random password is generated
# on every start for the in-memory H2 database instead of committing a credential to source
# control. Any deployment that previously relied on the removed default must rotate it.
spring.datasource.admin.password=${DB_ADMIN_PASSWORD:${random.uuid}}

spring.datasource.application.username=application
spring.datasource.application.password=hacker

# H2 Console is disabled: it exposes an unauthenticated SQL shell over HTTP which
# allows arbitrary queries and, in many setups, file/command access on the host.
# Remote (non-localhost) access to the console stays off as well.
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

vulnerableapp.email.base-url=http://localhost
