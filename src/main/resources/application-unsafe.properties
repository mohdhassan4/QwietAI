spring.datasource.admin.username=admin
# Credential must be rotated — previous value is exposed in git history.
spring.datasource.admin.password=${DATASOURCE_ADMIN_PASSWORD:hacker}

spring.datasource.application.username=application
# Credential must be rotated — previous value is exposed in git history.
spring.datasource.application.password=${DATASOURCE_APPLICATION_PASSWORD:hacker}

# Enabling H2 Console
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

vulnerableapp.email.base-url=http://localhost
