spring.datasource.admin.username=admin
# Password externalized to environment variable; set DB_ADMIN_PASSWORD at deployment
spring.datasource.admin.password=${DB_ADMIN_PASSWORD:}

spring.datasource.application.username=application
# Password externalized to environment variable; set DB_APP_PASSWORD at deployment
spring.datasource.application.password=${DB_APP_PASSWORD:}

# Enabling H2 Console
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=true

vulnerableapp.email.base-url=http://localhost
