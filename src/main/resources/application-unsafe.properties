spring.datasource.admin.username=admin
spring.datasource.admin.password=hacker

spring.datasource.application.username=application
spring.datasource.application.password=hacker

# Enabling H2 Console
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

vulnerableapp.email.base-url=http://localhost

# Authentication demo passwords (bcrypt hashes generated at startup)
# Provide actual password values via environment variables; app will fail-fast if unset.
auth.bcrypt.weak.password=${AUTH_BCRYPT_WEAK_PASSWORD:}
auth.bcrypt.secure.password=${AUTH_BCRYPT_SECURE_PASSWORD:}
auth.bcrypt.lowcost.password=${AUTH_BCRYPT_LOWCOST_PASSWORD:}

# Default SHA-256 salt used when a user record has no per-user salt
auth.sha256.default-salt=vulnerableapp-dev-salt
