spring.datasource.admin.username=admin
# Load DB admin password from environment; falls back to dev default when unset
spring.datasource.admin.password=${DB_ADMIN_PASSWORD:}

spring.datasource.application.username=application
# Load DB application password from environment; falls back to dev default when unset
spring.datasource.application.password=${DB_APP_PASSWORD:}

# Enabling H2 Console
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=true

vulnerableapp.email.base-url=http://localhost
