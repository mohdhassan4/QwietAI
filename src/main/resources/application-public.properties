spring.datasource.admin.username=${DB_ADMIN_USERNAME}
spring.datasource.admin.password=${DB_ADMIN_PASSWORD}

spring.datasource.application.username=application
spring.datasource.application.password=${DB_APP_PASSWORD}

spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
vulnerableapp.email.base-url=${APP_BASE_URL}
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Auth seed passwords — must be set via environment variables in production
auth.seed.password.level8=${AUTH_SEED_PASSWORD_LEVEL8}
auth.seed.password.level9=${AUTH_SEED_PASSWORD_LEVEL9}
auth.seed.password.level10=${AUTH_SEED_PASSWORD_LEVEL10}
